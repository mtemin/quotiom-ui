<app-navbar/>
<div class="container">
  <main id="quotes-page">
  <app-categories-sidebar/>

  <section id="quotes">

    <app-filtering-bar></app-filtering-bar>

      <section id="quote-list">
      <app-quote
        *ngFor="let quote of quotes"
        [id]="quote.id"
        [text]="quote.text"
        [author]="quote.author"
        [likes]="quote.likes"/>
      </section>
    </section>
  </main>
</div>
